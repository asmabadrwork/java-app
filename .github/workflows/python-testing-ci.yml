name: Python Testing App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'python-testing-app/**'
      - '.github/workflows/python-testing-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'python-testing-app/**'
      - '.github/workflows/python-testing-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-testing-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Build Docker image (verification)
        run: docker build -t python-testing-app .
