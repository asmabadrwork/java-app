name: React Testing App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'react-testing-app/**'
      - '.github/workflows/react-testing-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'react-testing-app/**'
      - '.github/workflows/react-testing-ci.yml'

jobs:
  ci:
    uses: vishuops0210/shared-repo/.github/workflows/ci-react.yml@main
    with:
      node-version: '18'

      # --- GITLEAKS (SECRET SCAN) ---
      enable-gitleaks: true
      gitleaks-fetch-depth: '10'

      # --- UNIT TESTS ---
      enable-unit-tests: true
      install-command: 'npm install'
      test-command: 'npm run test -- --coverage'

      # --- SONARQUBE (SAST) ---
      enable-sonarqube: true
      sonar-project-key: 'react-testing-app'
      sonar-exclusions: '**/__tests__/**'
      sonar-args: >
        -Dsonar.sources=src
        -Dsonar.tests=__tests__
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # --- TRIVY (SCA & IMAGE SCAN) ---
      enable-trivy-fs: false
      enable-trivy-image: true

      # --- DOCKER BUILD & PUSH ---
      enable-docker-build: true
      enable-docker-push: true
      enable-image-size-check: true

      docker-repository: 'react-testing-app'
      docker-tag: ${{ github.sha }}
      max-image-size-mb: '300'

      # --- ECR PUSH ---
      enable-ecr-push: true
      aws-region: 'ap-south-1'

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

